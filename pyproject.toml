[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmem"
version = "0.1.0"
description = "Dual-path latent memory manager for LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "transformers>=4.40",
  "accelerate",
  "bitsandbytes",
  "faiss-cpu",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
